services:
  - type: web
    name: vibloo
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
